name: Release Bloom
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish this version to Visual Studio Marketplace
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          fi
          if [[ "$EVENT_NAME" == push ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the tagged release source
        if: steps.version.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-vsix
          path: '*.vsix'
      - name: Attach package to GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" "bloom-highlighter-$VERSION.vsix" --verify-tag --title "Bloom $VERSION" --notes-file docs/RELEASE_NOTES.md
          fi
  marketplace:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
    needs: package
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-release
      - uses: actions/download-artifact@v4
        with:
          name: bloom-vsix
      - name: Publish validated VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "bloom-highlighter-$(node -p 'require("./package.json").version').vsix"
